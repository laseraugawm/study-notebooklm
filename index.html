<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소단원 학습자료 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1d2320; --muted:#5d6762; --line:#d9ddd8;
  --accent:#1f6f5c; --accent-soft:#e2efe9; --warn:#9a5b12; --code:#eef1ec;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --panel:#1b201d; --ink:#e4e9e5; --muted:#9aa59f; --line:#2c3430;
    --accent:#6cc4a8; --accent-soft:#1f3a31; --warn:#e0a85a; --code:#222925;
  }
}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1b201d; --ink:#e4e9e5; --muted:#9aa59f; --line:#2c3430;
  --accent:#6cc4a8; --accent-soft:#1f3a31; --warn:#e0a85a; --code:#222925;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 'IBM Plex Sans KR','Malgun Gothic',sans-serif;padding-inline:16px}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 60px}
header{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-size:24px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:260px 1fr;gap:24px;margin-top:20px}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
nav.units{display:flex;flex-direction:column;gap:6px}
.unit{all:unset;cursor:pointer;display:block;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.unit:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.unit[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.unit b{display:block;font-size:14px}
.unit span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.chip{font:500 11px/1 'IBM Plex Mono',monospace;padding:3px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent)}
main{min-width:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;padding:8px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[disabled]{opacity:.4;cursor:default}
.pane{background:var(--panel);border:1px solid var(--line);border-top:0;padding:20px 24px;min-height:300px;overflow-x:auto}
.md{max-width:78ch}
.md h1{font-size:21px}.md h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:4px}.md h3{font-size:16px}
.md table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.md th{background:var(--code)}
.md code{font-family:'IBM Plex Mono',monospace;background:var(--code);padding:1px 4px;border-radius:3px}
.md pre{background:var(--code);padding:12px;overflow-x:auto}
.empty{color:var(--muted)}
.meta{font:12px/1.5 'IBM Plex Mono',monospace;color:var(--muted);margin-top:16px}
audio,video{width:100%;max-width:100%;margin-top:8px}
.q{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.q p{margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 10px;margin:4px 0;cursor:pointer}
.opt.ok{border-color:var(--accent);background:var(--accent-soft)}
.opt.no{border-color:var(--warn)}
.why{font-size:13px;color:var(--muted);margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:14px;min-height:96px;background:var(--panel)}
.card .back{display:none;color:var(--accent);margin-top:8px}
.card.flip .back{display:block}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>소단원 학습자료 실험실</h1>
  <div class="sub" id="sub">고1 정보 · Ⅰ. 컴퓨팅 시스템 · NotebookLM 생성</div>
</header>
<div class="layout">
  <nav class="units" id="units" aria-label="소단원"></nav>
  <main>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="pane" id="pane" role="tabpanel"></div>
  </main>
</div>
<footer>교과서(천재교육, 김현철) 내용을 바탕으로 NotebookLM이 생성한 개인 학습용 시범 자료입니다. 교과서 원문은 포함하지 않습니다.</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const KINDS=[["report","개념정리"],["quiz","퀴즈"],["flashcards","플래시카드"],["audio","오디오"],["video","비디오"]];
let M,cur={u:0,k:"report"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=t=>DOMPurify.sanitize(marked.parse(t.replace(/\*\*([^*\n]+?)\*\*/g,"<strong>$1</strong>")));
async function boot(){
  M=await (await fetch("data/manifest.json",{cache:"no-store"})).json();
  $("#sub").textContent=`${M.subject} · ${M.chapter} · 갱신 ${M.updated}`;
  try{const h=new URLSearchParams(location.hash.slice(1));cur.u=Math.max(0,M.units.findIndex(x=>x.id===h.get("u")));cur.k=h.get("k")||"report";}catch{}
  renderUnits();render();
}
function renderUnits(){
  $("#units").innerHTML=M.units.map((u,i)=>`<button class="unit" aria-current="${i===cur.u}" data-i="${i}"><b>${esc(u.id)} ${esc(u.title)}</b><span>교과서 ${esc(u.pages)}쪽</span><div class="chips">${KINDS.map(([k,l])=>`<i class="chip ${u.files[k]?"on":""}">${l}</i>`).join("")}</div></button>`).join("");
  document.querySelectorAll(".unit").forEach(b=>b.onclick=()=>{cur.u=+b.dataset.i;renderUnits();render();});
}
function render(){
  const u=M.units[cur.u];
  $("#tabs").innerHTML=KINDS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${k===cur.k}" ${u.files[k]?"":"disabled"} data-k="${k}">${l}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(b.disabled)return;cur.k=b.dataset.k;render();});
  history.replaceState(null,"",`#u=${u.id}&k=${cur.k}`);
  show(u,cur.k);
}
async function show(u,k){
  const f=u.files[k],p=$("#pane");
  if(!f){p.innerHTML=`<p class="empty">아직 생성되지 않았습니다.</p>`;return;}
  const meta=`<div class="meta">${esc(f.file)} · 생성 ${esc(f.secs)}초 · ${esc(f.at)}</div>`;
  if(k==="audio"){p.innerHTML=`<audio controls preload="metadata" src="data/${esc(f.file)}"></audio>${meta}`;return;}
  if(k==="video"){p.innerHTML=`<video controls preload="metadata" src="data/${esc(f.file)}"></video>${meta}`;return;}
  if(k==="quiz"&&f.json){try{return quiz(await (await fetch("data/"+f.json)).json(),p,meta)}catch{}}
  if(k==="flashcards"&&f.json){try{return cards(await (await fetch("data/"+f.json)).json(),p,meta)}catch{}}
  p.innerHTML=`<div class="md">${md(await (await fetch("data/"+f.file)).text())}</div>${meta}`;
}
function list(j,keys){for(const k of keys){if(Array.isArray(j?.[k]))return j[k];}return Array.isArray(j)?j:null;}
function quiz(j,p,meta){
  const qs=list(j,["questions","quiz","items"]);if(!qs)throw 0;
  p.innerHTML=qs.map((q,i)=>{const opts=q.answerOptions||q.options||q.choices||[];
    return `<div class="q" data-i="${i}"><p><b>${i+1}.</b> ${esc(q.question||q.text)}</p>${opts.map((o,j)=>`<button class="opt" data-ok="${o.isCorrect??(q.answer===j||q.correct===j)}" data-why="${esc(o.rationale||"")}">${esc(o.text??o)}</button>`).join("")}<div class="why"></div></div>`}).join("")+meta;
  p.querySelectorAll(".q").forEach(d=>d.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{d.querySelectorAll(".opt").forEach(o=>{if(o.dataset.ok==="true")o.classList.add("ok")});if(b.dataset.ok!=="true")b.classList.add("no");d.querySelector(".why").textContent=b.dataset.why||"";}));
}
function cards(j,p,meta){
  const cs=list(j,["cards","flashcards","items"]);if(!cs)throw 0;
  p.innerHTML=`<div class="cards">${cs.map(c=>`<button class="card"><div>${esc(c.front||c.f||c.term||c.question)}</div><div class="back">${esc(c.back||c.b||c.definition||c.answer)}</div></button>`).join("")}</div>${meta}`;
  p.querySelectorAll(".card").forEach(c=>c.onclick=()=>c.classList.toggle("flip"));
}
boot().catch(e=>{$("#pane").innerHTML=`<p class="empty">목록을 불러오지 못했습니다: ${esc(e.message)}</p>`});
</script>
</body>
</html>
